<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HookLab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0b100d;
      color: #dce7df;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b100d; }
    header { padding: 24px 28px; border-bottom: 1px solid #203126; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; }
    header p { margin: 7px 0 0; color: #8fa397; font-size: 14px; }
    main { display: grid; grid-template-columns: minmax(320px, 42%) 1fr; min-height: calc(100vh - 90px); }
    aside { border-right: 1px solid #203126; padding: 18px; }
    section { padding: 22px; min-width: 0; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    button { background: #16231a; border: 1px solid #2d4a36; color: #cfe0d3; border-radius: 7px; padding: 8px 11px; cursor: pointer; }
    button:hover { background: #1d3023; }
    .item { width: 100%; text-align: left; margin-bottom: 8px; padding: 11px 12px; }
    .method { display: inline-block; min-width: 58px; color: #83d49a; font-weight: 700; }
    .path { color: #e5eee7; }
    .time { display: block; color: #708078; margin-top: 5px; font-size: 12px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0f1712; border: 1px solid #203126; border-radius: 8px; padding: 14px; overflow: auto; }
    .label { color: #78bd8a; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; margin: 18px 0 7px; }
    .empty { color: #7e8f85; padding: 10px 2px; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #203126; }
    }
  </style>
</head>
<body>
  <header>
    <h1>HookLab</h1>
    <p>Enviá requests a /hooks/&lt;nombre&gt; para inspeccionarlas.</p>
  </header>
  <main>
    <aside>
      <div class="toolbar">
        <strong>Requests</strong>
        <button id="clear">Limpiar</button>
      </div>
      <div id="list"></div>
    </aside>
    <section id="detail">
      <div class="empty">Seleccioná una request.</div>
    </section>
  </main>

  <script>
    const list = document.querySelector('#list');
    const detail = document.querySelector('#detail');

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    async function loadList() {
      const response = await fetch('/api/requests');
      const items = await response.json();
      list.replaceChildren();

      if (!items.length) {
        list.append(el('div', 'Todavía no hay requests.', 'empty'));
        return;
      }

      items.forEach(item => {
        const button = el('button', undefined, 'item');
        button.append(el('span', item.method, 'method'));
        button.append(el('span', item.path, 'path'));
        button.append(el('span', new Date(item.created_at).toLocaleString(), 'time'));
        button.addEventListener('click', () => loadDetail(item.id));
        list.append(button);
      });
    }

    async function loadDetail(id) {
      const response = await fetch('/api/requests/' + id);
      if (!response.ok) return;
      const item = await response.json();
      detail.replaceChildren();

      detail.append(el('div', item.method + ' ' + item.path, 'label'));
      detail.append(el('pre', item.query_string || '(sin query string)'));
      detail.append(el('div', 'Headers', 'label'));
      detail.append(el('pre', JSON.stringify(item.headers, null, 2)));
      detail.append(el('div', 'Body', 'label'));
      detail.append(el('pre', item.body || '(vacío)'));
    }

    document.querySelector('#clear').addEventListener('click', async () => {
      await fetch('/api/requests', { method: 'DELETE' });
      detail.innerHTML = '<div class="empty">Seleccioná una request.</div>';
      loadList();
    });

    loadList();
    setInterval(loadList, 2500);
  </script>
</body>
</html>
